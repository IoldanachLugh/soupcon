<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Soup Conditions</title>
    <meta
      name="description"
      content="Check the rain outlook for your location and see your Soup Condition (SOUPCON) — a tongue-in-cheek 5-level scale for whether it's a stay-home, make-soup kind of day."
    />

    <!-- Open Graph: baseline tags so shared links get a real title/description/
         image instead of nothing. og:url is intentionally the production
         root -- Open Graph tags are inherently absolute and don't have a
         subpath-relative equivalent the way build assets do, so this is
         only accurate when shared from the production site, not /dev/.
         Revisit og:image with a dedicated 1200x630 share image (and
         per-location previews) if/when the shelved server-rendered share
         previews get built -- icon-512.png is a reasonable placeholder for
         now, not the final answer. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Soup Conditions (SOUPCON)" />
    <meta
      property="og:description"
      content="Check the rain outlook for your location and see your Soup Condition — should you make soup and stay home today?"
    />
    <meta property="og:image" content="https://soupcon.org/icon-512.png" />
    <meta property="og:url" content="https://soupcon.org/" />

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1a0f2e" />
    <!-- mobile-web-app-capable is the standard tag Chrome/Android look for;
         apple-mobile-web-app-capable is deprecated but still what older iOS
         Safari versions need, so both stay. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
