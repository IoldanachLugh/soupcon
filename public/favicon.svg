    <!-- Raindrops falling toward the bowl. -->
    <path d="M190,178 C207,196 209,216 190,226 C171,216 173,196 190,178 Z" fill="#5B8DEF" />
    <path d="M256,140 C277,162 280,187 256,199 C232,187 235,162 256,140 Z" fill="#5B8DEF" />
